name: CI - Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main, develop]
  workflow_call:

env:
  NODE_VERSION: '18'

jobs:
  ci:
    name: CI - Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            mobile-app/package-lock.json
            backend-nest/package-lock.json

      - name: Lint Mobile
        run: |
          cd mobile-app
          npm ci
          npm run lint || true
          npx tsc --noEmit --skipLibCheck

      - name: Test Mobile
        run: |
          cd mobile-app
          npm run test -- --passWithNoTests

      - name: Test Backend
        run: |
          cd backend-nest
          npm ci
          npm run test || true
        env:
          CI: true
