# ─── Kuli Backend: CI/CD Pipeline ─────────────────────────────────────────
# Builds the Docker image, pushes to Docker Hub, and deploys to EC2.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME    — Your Docker Hub username
#   DOCKERHUB_TOKEN       — Docker Hub access token (not password)
#   EC2_HOST              — Public IP of your EC2 instance
#   EC2_SSH_KEY           — Private SSH key (PEM format) for EC2 access
#   EC2_USERNAME          — SSH username (default: ubuntu)

name: Deploy Kuli Backend

on:
  push:
    branches: [main]
    paths:
      - 'kuli-backend/**'
  workflow_dispatch:  # Allow manual triggers

env:
  DOCKER_IMAGE: kulilabour/kuli-backend

jobs:
  # ─── Job 1: Test ────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuli-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: kuli-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

  # ─── Job 2: Build & Push Docker Image ──────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: kuli-backend

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: kuli-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy to EC2 ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "🚀 Starting deployment..."

            # Navigate to app directory
            cd /opt/kuli

            # Pull the latest Docker image
            docker pull kulilabour/kuli-backend:latest

            # Copy the latest docker-compose file (already on server via setup)
            # Stop existing containers gracefully
            docker compose -f docker-compose.prod.yml down || true

            # Start with the new image
            docker compose -f docker-compose.prod.yml up -d

            # Wait for the API to be healthy
            echo "⏳ Waiting for API to start..."
            sleep 10

            # Run database migrations
            docker exec kuli-api npx prisma migrate deploy || echo "⚠️ Migration skipped (may already be up-to-date)"

            # Verify health
            curl -sf http://localhost:3000/ > /dev/null && echo "✅ API is healthy!" || echo "❌ API health check failed"

            echo "🎉 Deployment complete!"
